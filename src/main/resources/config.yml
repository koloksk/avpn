#=========== PERMISSIONS ===========
permissions:
  admin: "avpn.admin"
  bypass: "avpn.bypass"

#=========== MESSAGES ===========
messages:
  country: "Your country is not allowed"
  vpn: "VPN is not allowed"
  max-connections: "Max connections per IP"
  nick: "Your nickname is not allowed"

#=========== COUNTRY CHECK ===========
country:
  enabled: false            # Enable or disable country-based restrictions
  only-attack: true         # Apply restrictions only during an attack
  whitelist: true           # If false, the whitelist acts as a blacklist
  list:
    - CH                    # List of allowed or disallowed countries

#=========== ASN CHECK ===========
asn:
  enabled: true             # EXPERIMENTAL: Check player organization ASN
  only-attack: true         # Apply ASN check only during an attack

#=========== IP CHECK ===========
max-join-per-ip:
  enabled: false            # Enable or disable IP-based connection limits
  limit: 4                  # Maximum players allowed to connect from the same IP

ip-list:
  enabled: true             # Enable or disable IP blacklist
  only-attack: true         # Apply IP blacklist only during an attack

#=========== API CHECK ===========
api:
  enabled: true             # Enable or disable API check

#=========== NICKNAME CHECK ===========
block_nick:
  enabled: true             # Enable or disable nickname blocking
  list:
    - "mcstorm"
    - "mcspam"
    - "mcdrop"
    - "bot"
    - "spam"
    - "spammer"
    - "CPROXY_"
    - "ttproxy"
    - "AirProxy_"
    - "McDown_pw"
    - "ttp00roxy"

#=========== ATTACK DETECTION ===========
detect_attack:
  min-jps: 5                # Minimum join-per-second threshold to detect an attack

#=========== INTEGRATIONS ===========
integrations:
  authme:
    enabled: false          # Disable or enable AuthMe integration during attacks
    kick: "Server is under attack. Please wait a few minutes and try again."
  discord:
    enabled: false          # Disable or enable Discord integration
    webhook-url: ''         # URL for the Discord webhook

#=========== DEBUGGING & STATS ===========
Debug: false                # Enable or disable debug mode
stats:
  blocked: 0                # Number of blocked connections
